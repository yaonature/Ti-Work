name: CI

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Silence deprecation warning

jobs:
  # ── G0 门禁 ② 静态门禁：ti-work-rules（TODO/占位符/mock/硬编码密钥零容忍）
  lint:
    name: Static Gate (lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run static gate (eslint + ti-work-rules)
        run: pnpm lint

  # ── G0 门禁 ①③ 契约门禁 + 行为门禁：vitest 全量（含真实 Redis 集成契约测试）
  unit-tests:
    name: Contract & Behavior Tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit & integration tests
        run: pnpm exec vitest run --reporter=json --outputFile=test-results.json
        env:
          TI_WORK_TEST_REDIS_URL: redis://localhost:6379

      - name: Update test badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          PASSED=$(node -e "
            const r = require('./test-results.json');
            console.log(r.numPassedTests ?? 0);
          ")
          echo "{\"schemaVersion\":1,\"label\":\"tests\",\"message\":\"${PASSED} passed\",\"color\":\"brightgreen\"}" > badges/tests.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add badges/tests.json
          git diff --staged --quiet || git commit -m "ci: update test badge [skip ci]"
          git push

  # ── G0 门禁 ④ 运行门禁：build + 启动 + 健康检查 + 核心 API 冒烟
  verify-build:
    name: Verify Build (smoke)
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run verify-build (build + boot + API smoke)
        run: pnpm verify
        env:
          NODE_OPTIONS: '--max-old-space-size=2048'

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: verify-build
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build app
        run: pnpm build
        env:
          NODE_OPTIONS: '--max-old-space-size=2048'

      - name: Run E2E tests
        run: pnpm exec playwright test
        env:
          CI: true
          NODE_OPTIONS: '--max-old-space-size=2048'

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

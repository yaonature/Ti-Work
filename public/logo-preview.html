<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>Ti Work 扶桑树 Logo 预览</title>
<style>
  body { margin:0; font-family:"Segoe UI",system-ui,sans-serif; background:#0F0F11; color:#E8E8EA; }
  .wrap { max-width:880px; margin:0 auto; padding:40px 24px 80px; }
  h1 { font-size:20px; font-weight:600; margin:0 0 6px; }
  p.desc { font-size:13px; color:#9A9AA2; margin:0 0 28px; line-height:1.7; }
  .section { margin-bottom:36px; }
  .section h2 { font-size:14px; font-weight:600; color:#C7C7CE; margin:0 0 14px; border-left:3px solid #368CFF; padding-left:10px; }
  .grid { display:flex; flex-wrap:wrap; gap:16px; }
  .card { border:1px solid #26262B; border-radius:14px; padding:20px; background:#16161A; text-align:center; }
  .card.light { background:#F4F4F5; border-color:#E4E4E7; }
  .card .cap { font-size:12px; color:#8A8A93; margin-top:10px; }
  .card.light .cap { color:#71717A; }
  .row { display:flex; align-items:center; gap:10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Ti Work — 扶桑树 Logo 预览</h1>
  <p class="desc">
    设计原型：<b>扶桑</b>（东方汤谷神木，金乌栖止之所），日出扶桑。<br/>
    品牌蓝扶桑树承托金色日轮，寓意新生、晨光与东方——替换原菱形几何标。
  </p>

  <div class="section">
    <h2>主标（ti-work-logo.svg）</h2>
    <div class="grid">
      <div class="card"><img src="/ti-work-logo.svg" width="256" height="256"/><div class="cap">256px · 启动屏/登录</div></div>
      <div class="card"><img src="/ti-work-logo.svg" width="96" height="96"/><div class="cap">96px · 侧栏/头像</div></div>
      <div class="card"><img src="/ti-work-logo.svg" width="40" height="40"/><div class="cap">40px · 导航</div></div>
      <div class="card"><img src="/ti-work-logo.svg" width="20" height="20"/><div class="cap">20px · 最小场景</div></div>
    </div>
  </div>

  <div class="section">
    <h2>亮色背景下（浅色模式）</h2>
    <div class="grid">
      <div class="card light"><img src="/ti-work-logo.svg" width="96" height="96"/><div class="cap">96px · 浅色底</div></div>
      <div class="card light"><img src="/ti-work-logo.svg" width="40" height="40"/><div class="cap">40px · 浅色底</div></div>
    </div>
  </div>

  <div class="section">
    <h2>位图产物（安装包 / 托盘 / PWA）</h2>
    <div class="grid">
      <div class="card"><img src="/hermes-icon-512.png" width="128" height="128"/><div class="cap">安装包/应用图标 512</div></div>
      <div class="card"><img src="/apple-touch-icon.png" width="96" height="96"/><div class="cap">iOS 主屏 180</div></div>
      <div class="card"><img src="/hermes-icon-192.png" width="96" height="96"/><div class="cap">PWA 192</div></div>
    </div>
  </div>
</div>
</body>
</html>
